<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OldChat 管理控制台</title>
  <link rel="stylesheet" href="/admin/admin-base.css">
  <link rel="stylesheet" href="/admin/admin-components.css">
  <script src="/admin/icons.js"></script>
</head>
<body>
  <div id="admin-app">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="mainSidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo" id="appLogo">OC</div>
        <span>OldChat Console</span>
        <span class="brand-sub">ADMIN</span>
      </div>
      <ul class="nav-list" id="navList">
        <li class="nav-group">概览</li>
        <li class="nav-item active" data-tab="dashboard">
          <span class="nav-icon" data-icon="dashboard"></span>
          <span>仪表盘</span>
        </li>

        <li class="nav-group">用户</li>
        <li class="nav-item" data-tab="users">
          <span class="nav-icon" data-icon="users"></span>
          <span>用户与设备</span>
        </li>
        <li class="nav-item" data-tab="appeals">
          <span class="nav-icon" data-icon="shield"></span>
          <span>封禁申诉</span>
          <span class="nav-badge" id="badgeAppeals" style="display:none">0</span>
        </li>
        <li class="nav-item" data-tab="reports">
          <span class="nav-icon" data-icon="shield"></span>
          <span>举报工单</span>
        </li>
        <li class="nav-item" data-tab="court">
          <span class="nav-icon" data-icon="scale"></span>
          <span>公共法庭</span>
        </li>

        <li class="nav-group">内容</li>
        <li class="nav-item" data-tab="groups">
          <span class="nav-icon" data-icon="messageSquare"></span>
          <span>群组治理</span>
        </li>
        <li class="nav-item" data-tab="market">
          <span class="nav-icon" data-icon="database"></span>
          <span>称号与表情</span>
        </li>
        <li class="nav-item" data-tab="apps">
          <span class="nav-icon" data-icon="lock"></span>
          <span>小程序</span>
        </li>
        <li class="nav-item" data-tab="broadcast">
          <span class="nav-icon" data-icon="activity"></span>
          <span>全服广播</span>
        </li>
        <li class="nav-item" data-tab="bugs">
          <span class="nav-icon" data-icon="sliders"></span>
          <span>Bug 反馈</span>
        </li>

        <li class="nav-group">客户端</li>
        <li class="nav-item" data-tab="clients">
          <span class="nav-icon" data-icon="device"></span>
          <span>客户端入口</span>
        </li>
        <li class="nav-item" data-tab="release">
          <span class="nav-icon" data-icon="download"></span>
          <span>版本发布</span>
        </li>

        <li class="nav-group">系统</li>
        <li class="nav-item" data-tab="metrics">
          <span class="nav-icon" data-icon="activity"></span>
          <span>接口监控</span>
        </li>
        <li class="nav-item" data-tab="routes">
          <span class="nav-icon" data-icon="sliders"></span>
          <span>路由开关</span>
        </li>
        <li class="nav-item" data-tab="resources">
          <span class="nav-icon" data-icon="database"></span>
          <span>资源与限速</span>
        </li>
        <li class="nav-item" data-tab="settings">
          <span class="nav-icon" data-icon="sliders"></span>
          <span>全局设置</span>
        </li>
        <li class="nav-item" data-tab="logs">
          <span class="nav-icon" data-icon="terminal"></span>
          <span>系统日志</span>
        </li>
      </ul>
      <div class="sidebar-footer">
        <button class="btn btn-icon" id="btnThemeToggle" title="切换主题">
          <span data-icon="sun" id="themeIcon"></span>
        </button>
        <button class="btn btn-danger" id="btnLogout" title="退出登录">
          <span data-icon="logout"></span>
          <span>退出</span>
        </button>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <!-- 主界面 -->
    <main class="main-wrapper">
      <header class="top-header">
        <button class="btn btn-icon btn-sm sidebar-toggle" id="btnSidebarToggle" title="菜单" aria-label="菜单">
          <span class="menu-lines"></span>
        </button>
        <div class="header-title" id="pageTitle">仪表盘</div>
        <div class="header-actions">
          <button class="btn btn-sm" id="btnGlobalRefresh">
            <span data-icon="refresh"></span>
            <span>刷新</span>
          </button>
        </div>
      </header>

      <section class="content-body" id="contentBody">
        <!-- 动态视图挂载区 -->
      </section>
    </main>
  </div>

  <!-- 全局 Toast 挂载点 -->
  <div id="toast-container" class="toast-container"></div>

  <!-- 全局 Modal 挂载点 -->
  <div id="globalModal" class="modal-overlay">
    <div class="modal-box" id="globalModalContent"></div>
  </div>

  <script src="/admin/admin-core.js"></script>
  <script src="/admin/admin-views.js"></script>
  <script src="/admin/admin-social.js"></script>
  <script src="/admin/admin-market.js"></script>
  <script src="/admin/admin-apps.js"></script>
  <script src="/admin/admin-settings.js"></script>
  <script src="/admin/admin-ops.js"></script>
  <script src="/admin/admin-metrics.js"></script>
  <script src="/admin/admin-routeswitch.js"></script>
  <script src="/admin/admin-release.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
