plugins {
    id 'com.android.application'
    
}

def slimFontsEnabled = project.hasProperty('SLIM_FONTS') &&
        String.valueOf(project.property('SLIM_FONTS')).toBoolean()
def testPkgSuffixEnabled = project.hasProperty('TEST_PKG_SUFFIX') &&
        String.valueOf(project.property('TEST_PKG_SUFFIX')).toBoolean()
def v2OnlyTestEnabled = project.hasProperty('V2_ONLY_TEST') &&
        String.valueOf(project.property('V2_ONLY_TEST')).toBoolean()
def slimAssetsDir = file("$buildDir/generated/slimAssets")

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.im.oldchat'
    compileSdk 33

    defaultConfig {
        applicationId "com.im.oldchat"
        minSdk 9
        targetSdk 33
        versionCode 540
        versionName "1.4.5"
        vectorDrawables.useSupportLibrary = true
        resConfigs "zh"
        buildConfigField "boolean", "V2_ONLY_TEST", "false"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        debug {
            if (testPkgSuffixEnabled) {
                applicationIdSuffix ".test"
            }
            multiDexEnabled true
            buildConfigField "boolean", "V2_ONLY_TEST", String.valueOf(v2OnlyTestEnabled)
        }
        release {
            if (testPkgSuffixEnabled) {
                applicationIdSuffix ".test"
            }
            multiDexEnabled true
            minifyEnabled true
            shrinkResources true
            // 未提供 keystore.properties 时构建未签名 APK，便于开源用户自行签名
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            buildConfigField "boolean", "V2_ONLY_TEST", String.valueOf(v2OnlyTestEnabled)
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // AGP 8 uses JDK 17+; Java 7 bytecode is no longer supported by javac.
        // Keep code Java-7-compatible (no language features), but compile with 1.8 + desugaring.
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += [
                    'LICENSE-junit.txt',
                    'org/spongycastle/x509/CertPathReviewerMessages.properties',
                    'org/spongycastle/x509/CertPathReviewerMessages_de.properties'
            ]
        }
    }

}

configurations.configureEach {
    exclude group: 'com.itsaky.androidide', module: 'logger'
    exclude group: 'com.itsaky.androidide', module: 'logsender'
}

dependencies {
    // 使用 Support Library 24.2.1 - 最后一个支持 minSdk 9 的版本
    implementation 'com.android.support:appcompat-v7:24.2.1'
    implementation 'com.android.support:recyclerview-v7:24.2.1'
    implementation 'com.android.support:support-v4:24.2.1'
    implementation 'com.android.support:multidex:1.0.3'

    // 其他依赖保持不变
    implementation 'com.google.code.gson:gson:2.8.5'
    implementation 'com.google.zxing:core:3.3.3'
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    // Android 2.3 系统 TLS 仅到 1.0；服务端要求 TLS 1.2，因此内置兼容 provider。
    implementation 'com.madgag.spongycastle:prov:1.58.0.0'
    // 纯 Java Lua 5.2 运行时，用于发现页沙箱小程序。
    implementation 'org.luaj:luaj-jse:3.0.1'
}

if (slimFontsEnabled) {
    tasks.register('prepareSlimAssets', Copy) {
        from('src/main/assets') {
            exclude 'fonts/inter_regular.ttf'
            exclude 'fonts/jetbrains_mono_regular.ttf'
        }
        into(slimAssetsDir)
        includeEmptyDirs = false
    }
    android.sourceSets.main.assets.srcDirs = [slimAssetsDir]
    tasks.configureEach { task ->
        if (task.name != 'prepareSlimAssets' && task.name.toLowerCase().contains('release')) {
            task.dependsOn('prepareSlimAssets')
        }
    }
    println('[SLIM_FONTS] enabled: release uses generated assets without inter/jetbrains fonts.')
}
